{{- range $c := list "api" "diagnostics" }}
{{- $cfg := index $.Values $c }}
{{- if and $cfg.secretEnv (not $cfg.existingSecret) }}
{{- $ctx := dict "root" $ "component" $c "cfg" $cfg }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lg.componentName" $ctx }}
  labels:
    {{- include "lg.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $cfg.secretEnv }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
