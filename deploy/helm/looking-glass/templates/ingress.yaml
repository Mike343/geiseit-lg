{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lg.fullname" . }}
  labels:
    {{- include "lg.baseLabels" . | nindent 4 }}
    {{- with $ing.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if and $ing.tls.enabled $ing.certManager.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $ing.certManager.clusterIssuer | quote }}
    {{- end }}
    {{- if $ing.nginx.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: {{ $ing.tls.enabled | quote }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ $ing.tls.enabled | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ $ing.nginx.proxyReadTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ $ing.nginx.proxySendTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $ing.nginx.proxyBodySize | quote }}
    {{- end }}
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        - {{ $ing.host | quote }}
      secretName: {{ $ing.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "lg.componentName" (dict "root" . "component" "api") }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lg.componentName" (dict "root" . "component" "web") }}
                port:
                  name: http
{{- end }}
