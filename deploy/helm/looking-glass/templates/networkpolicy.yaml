{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $web := dict "root" . "component" "web" }}
{{- $api := dict "root" . "component" "api" }}
{{- $diag := dict "root" . "component" "diagnostics" }}
{{- $http := .Values.ports.http }}
{{- $metrics := .Values.ports.metrics }}
{{- $shared := dict "np" $np }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lg.fullname" . }}-default-deny
  labels:
    {{- include "lg.baseLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lg.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [web, api, diagnostics]
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lg.componentName" $web }}
  labels:
    {{- include "lg.labels" $web | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lg.selectorLabels" $web | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "lg.np.ingressController" $shared | nindent 8 }}
        {{- if .Values.tests.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: test
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $http }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "lg.selectorLabels" $api | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $http }}
    {{- include "lg.np.dns" $shared | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lg.componentName" $api }}
  labels:
    {{- include "lg.labels" $api | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lg.selectorLabels" $api | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "lg.np.ingressController" $shared | nindent 8 }}
        - podSelector:
            matchLabels:
              {{- include "lg.selectorLabels" $web | nindent 14 }}
        {{- if .Values.tests.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: test
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $http }}
    - from:
        {{- include "lg.np.monitoring" $shared | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $metrics }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "lg.selectorLabels" $diag | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $http }}
    {{- include "lg.np.dns" $shared | nindent 4 }}
    {{- if $np.otlpEgress.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.otlpEgress.namespaceSelector | nindent 14 }}
          {{- with $np.otlpEgress.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $np.otlpEgress.port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lg.componentName" $diag }}
  labels:
    {{- include "lg.labels" $diag | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lg.selectorLabels" $diag | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "lg.selectorLabels" $api | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $http }}
    - from:
        {{- include "lg.np.monitoring" $shared | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $metrics }}
  egress:
    {{- $v4 := list }}
    {{- $v6 := list }}
    {{- range concat $np.diagnostics.exceptCidrs $np.diagnostics.extraExceptCidrs }}
    {{- if contains ":" . }}{{ $v6 = append $v6 . }}{{ else }}{{ $v4 = append $v4 . }}{{ end }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with $v4 }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        - ipBlock:
            cidr: ::/0
            {{- with $v6 }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- if $np.diagnostics.allowClusterDns }}
    {{- include "lg.np.dns" $shared | nindent 4 }}
    {{- end }}
{{- end }}
