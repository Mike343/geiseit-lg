{{- $g := .Values.monitoring.grafanaDashboard }}
{{- if $g.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lg.fullname" . }}-dashboard
  namespace: {{ default .Release.Namespace $g.namespace }}
  labels:
    {{- include "lg.baseLabels" . | nindent 4 }}
    {{- with $g.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $g.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  looking-glass.json: |-
    {{- .Files.Get "dashboards/looking-glass.json" | nindent 4 }}
{{- end }}
